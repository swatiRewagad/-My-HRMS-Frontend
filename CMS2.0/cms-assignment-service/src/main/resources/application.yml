server:
  port: 8085
  servlet:
    context-path: /cms-assignment

spring:
  application:
    name: cms-assignment-service

  datasource:
    url: jdbc:oracle:thin:@${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:CMSDB}
    username: ${DB_USER:cms_assignment}
    password: ${DB_PASSWORD:cms_assignment}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: cms-assignment-group
      auto-offset-reset: earliest
      enable-auto-commit: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:9090}/realms/rbi-cms

cms:
  assignment:
    default-tenant: RBI-CMS
    cache:
      refresh-interval-seconds: 30
    resolve:
      max-batch-size: 500
    rules:
      max-rules-per-version: 5000
      max-conditions-per-rule: 50
      max-in-list-size: 500
      max-import-file-size-mb: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    com.rbi.cms: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
