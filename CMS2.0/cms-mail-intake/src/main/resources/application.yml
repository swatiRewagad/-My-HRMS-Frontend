server:
  port: 8092
  servlet:
    context-path: /cms-mail-intake

spring:
  application:
    name: cms-mail-intake

  datasource:
    url: jdbc:oracle:thin:@${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:CMSDB}
    username: ${DB_USER:cms_mail_intake}
    password: ${DB_PASSWORD:cms_mail_intake}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      # Schema is hand-maintained SQL (database/V11__mail_intake.sql, mirrored under
      # database/oracle/) applied out-of-band by DBAs — matches every other service in this repo.
      # No Flyway here; see the Stage 1 discussion for why.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
        default_schema: CMS_MAIL_INTAKE

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  security:
    oauth2:
      resourceserver:
        jwt:
          # Same realm (rbi-cms) and issuer-uri shape as cms-assignment-service — see
          # MailIntakeSecurityConfig for the required-role check on /admin/mail-intake/**.
          issuer-uri: ${KEYCLOAK_URL:http://localhost:9090}/realms/rbi-cms

# ══════════════════════════════════════════════════════════════════════════
# cms.mail.intake.* — every threshold/regex/address/CIDR/timeout the intake
# design uses. Nothing below should ever need a code change to retune.
# ══════════════════════════════════════════════════════════════════════════
cms:
  mail:
    intake:

      listener:
        bind-address: 0.0.0.0
        # The JVM cannot bind :25 as non-root — see RUNBOOK.md for setcap / authbind / iptables
        # REDIRECT / relay-through-Postfix options. 2525 here assumes one of those is in place, or
        # that you're relaying from the DC's existing MTA rather than binding :25 directly.
        port: ${MAIL_INTAKE_SMTP_PORT:2525}
        backlog: 50
        connection-timeout-seconds: 60
        command-timeout-seconds: 30
        max-concurrent-connections: 50
        max-connections-per-ip: 5
        max-message-size-bytes: 26214400 # 25 MB
        max-recipients-per-transaction: 1 # rule 2 (never an open relay) depends on this — see brief

      tls:
        # Start false if the RBI relay is old and doesn't speak STARTTLS cleanly; flip once
        # confirmed. Cert/key are for cms20.rbi.org.in.
        required: ${MAIL_INTAKE_TLS_REQUIRED:false}
        cert-path: ${MAIL_INTAKE_TLS_CERT_PATH:}
        key-path: ${MAIL_INTAKE_TLS_KEY_PATH:}

      allowlist:
        # CIDRs for the RBI mail relay — get this in writing from the Data Centre / mail team.
        # This list IS the authentication mechanism (SPF/DKIM will fail by design on
        # redirected/forwarded mail — do not gate on them). Empty by default so the service
        # refuses to accept traffic from anywhere until deliberately configured.
        cidrs: ${MAIL_INTAKE_ALLOWLIST_CIDRS:}

      recipients:
        # RCPT TO must exactly match one of these; anything else is 550 5.7.1.
        bot-addresses:
          - cms20bot@cms20.rbi.org.in

      loop-guard:
        header-name: X-CMS-Loop-Guard
        block-auto-submitted: true
        block-bulk-precedence: true

      resolver:
        # If the mail team can add a custom header at the relay, prefer it — set the name here.
        original-sender-header-name: X-Original-Sender
        nested-message-depth-cap: 5
        # language -> regex for the "-----Original Message-----" style inline-forward block.
        # Outlook localises these labels; CMS supports 10 languages. Adding a language is this
        # config change, not a code change. English + Hindi ship as defaults (see
        # MailIntakeProperties.Resolver#defaultInlineForwardPatterns) — override/extend here if
        # the defaults don't match what actually arrives.
        inline-forward-patterns: {}

      complaint-ref:
        # Matched against subject/body so a reply threads onto an existing complaint instead of
        # opening a duplicate. Adjust to the real CMS complaint-number format.
        regex: "\\bCMP-[A-Z0-9-]{6,20}\\b"

      attachments:
        max-count: 20
        max-individual-size-bytes: 10485760 # 10 MB
        max-total-size-bytes: 26214400      # 25 MB
        zip-bomb:
          max-decompression-ratio: 100
          max-depth: 5

      retry:
        max-attempts: 8
        initial-backoff-seconds: 30
        max-backoff-seconds: 3600
        backoff-multiplier: 2.0

      retention:
        # Raw bytes purged after this many days; the inbound_email row and its audit trail
        # (inbound_email_event) are kept regardless — see the Stage 5 retention job.
        raw-bytes-retention-days: 180

      storage:
        raw-message-base-path: ${MAIL_INTAKE_STORAGE_PATH:/data/cms/mail-intake/raw}

      encryption:
        # Name of the env var holding the base64 AES-256 key — never the key value itself here.
        key-env-var: CMS_MAIL_INTAKE_ENCRYPTION_KEY

      admin:
        # Keycloak realm role required for every /admin/mail-intake/** endpoint.
        required-role: MAIL_INTAKE_ADMIN

      health:
        # RECEIVED + due-FAILED backlog above this makes the /actuator/health check go DOWN.
        queue-depth-warning-threshold: 500

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: cms-mail-intake

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.rbi.cms: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
