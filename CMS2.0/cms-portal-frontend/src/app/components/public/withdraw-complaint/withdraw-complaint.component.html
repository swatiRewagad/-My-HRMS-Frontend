<div class="withdraw-detail-page">
  <div class="search-container">
    <div class="search-card">
      <div class="search-icon">
        <i class="pi pi-times-circle" aria-hidden="true"></i>
      </div>
      <h2>{{ 'withdraw.title' | translate }}</h2>
      <p class="search-subtitle">{{ 'withdraw.subtitle' | translate }}</p>

      <div class="form-group">
        <label for="complaintRef">{{ 'withdraw.ref_label' | translate }} <span class="required">*</span></label>
        <div class="input-wrapper">
          <i class="pi pi-search" aria-hidden="true"></i>
          <input type="text" id="complaintRef" class="form-input"
                 [(ngModel)]="complaintId" name="complaintId"
                 placeholder="e.g., CMP-20260525-000001"
                 (keydown.enter)="searchComplaint()" autocomplete="off">
        </div>
      </div>

      @if (error()) {
        <div class="error-msg"><i class="pi pi-exclamation-circle"></i> {{ error() }}</div>
      }

      <div class="search-actions">
        <button class="btn-secondary" (click)="goBack()">
          <i class="pi pi-arrow-left"></i> {{ 'withdraw.cancel' | translate }}
        </button>
        <button class="btn-primary" (click)="searchComplaint()" [disabled]="loading()">
          @if (loading()) { <i class="pi pi-spinner pi-spin"></i> {{ 'withdraw.searching' | translate }} }
          @else { <i class="pi pi-search"></i> {{ 'withdraw.find' | translate }} }
        </button>
      </div>
    </div>
  </div>
</div>
