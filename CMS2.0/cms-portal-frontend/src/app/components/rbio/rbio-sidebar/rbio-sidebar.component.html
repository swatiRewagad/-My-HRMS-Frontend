<aside class="sb" [@sidebarWidth]="isCollapsed() ? 'collapsed' : 'expanded'">

  <nav class="sb-nav">
    @for (item of navItems(); track item.label) {
      <a class="sb-item" [routerLink]="item.routerLink" [queryParams]="item.queryParams || null"
        routerLinkActive="sb-item--active" [routerLinkActiveOptions]="{ exact: false }"
        [pTooltip]="isCollapsed() ? item.label : ''" tooltipPosition="right">

        <i [class]="item.icon" class="sb-item__icon"></i>

        <span class="sb-item__label" [@fadeText]="isCollapsed() ? 'hidden' : 'visible'">
          {{ item.label }}
        </span>
      </a>
    }
  </nav>

  <button type="button" class="sb-toggle" (click)="toggleSidebar()"
    [pTooltip]="isCollapsed() ? 'Expand' : ''" tooltipPosition="right">

    <i class="pi" [ngClass]="isCollapsed() ? 'pi-chevron-right' : 'pi-chevron-left'"></i>

    <span class="sb-toggle__label" [@fadeText]="isCollapsed() ? 'hidden' : 'visible'">
      Collapse
    </span>
  </button>

</aside>
