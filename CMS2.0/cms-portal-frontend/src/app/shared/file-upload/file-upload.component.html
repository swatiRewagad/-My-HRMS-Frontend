<div class="file-upload-wrapper">
  <label class="upload-label">{{ label }}@if (required) { <span class="required">*</span>}</label>

  <div class="file-upload-area" [class.dragover]="isDragOver"
       (dragover)="onDragOver($event)"
       (dragenter)="onDragOver($event)"
       (dragleave)="onDragLeave($event)"
       (drop)="onFileDrop($event)">
    <input type="file"
           [id]="inputId"
           [multiple]="multiple"
           [accept]="accept"
           (change)="onFilesSelected($event)"
           class="file-input-hidden">
    <div class="upload-content">
      <i class="pi pi-cloud-upload upload-icon"></i>
      <span class="upload-text">
        Drag and Drop or <label [for]="inputId" class="browse-link">Browse</label> File
      </span>
    </div>
  </div>

  <div class="upload-meta">
    <span class="meta-hint">{{ hint }}</span>
    <span class="meta-size">{{ sizeHint }}</span>
  </div>

  @if (errorMessage()) {
    <div class="error-msg">
      <i class="pi pi-exclamation-circle"></i>
      <span>{{ errorMessage() }}</span>
    </div>
  }

  @if (files.length > 0) {
    <div class="file-list">
      @for (f of files; track $index; let i = $index) {
        <div class="file-chip">
          <i class="pi pi-file file-icon"></i>
          <span class="file-name" [title]="f.name">{{ f.name }}</span>
          <span class="file-size">{{ formatSize(f.size) }}</span>
          <span class="file-actions">
            <button class="action-btn view-btn" (click)="previewFile(i)" type="button" title="View">
              <i class="pi pi-eye"></i>
            </button>
            <button class="action-btn delete-btn" (click)="removeFile(i)" type="button" title="Delete">
              <i class="pi pi-trash"></i>
            </button>
          </span>
        </div>
      }
    </div>
  }
</div>
