spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cms_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true
    username: cms_user
    password: cms_pass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      data-locations: classpath:data-mysql.sql

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      group-id: cms-workflow-group
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      missing-topics-fatal: false
      ack-mode: manual

kogito:
  persistence:
    type: jdbc
    jdbc:
      dialect: mysql

cms:
  kafka:
    retry:
      max-attempts: 3
      backoff-ms: 1000
    consumer:
      concurrency: 1
    idempotency:
      retention-days: 7
      cleanup-cron: "0 0 2 * * ?"

logging:
  level:
    com.rbi.cms: DEBUG
    org.springframework.kafka: INFO
