spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cms_workflow?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      group-id: cms-workflow-group
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      type: single
      missing-topics-fatal: false
      ack-mode: manual

kogito:
  persistence:
    type: jdbc
    jdbc:
      dialect: mysql

cms:
  kafka:
    retry:
      max-attempts: 1
      backoff-ms: 500
    consumer:
      concurrency: 1
    idempotency:
      retention-days: 1
      cleanup-cron: "0 0 * * * ?"

logging:
  level:
    com.rbi.cms: DEBUG
