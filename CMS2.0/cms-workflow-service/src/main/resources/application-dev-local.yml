spring:
  datasource:
    url: jdbc:h2:mem:cms_workflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=Oracle
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: true
    defer-datasource-initialization: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      group-id: cms-workflow-group
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      type: single
      missing-topics-fatal: false
      ack-mode: manual

kogito:
  persistence:
    type: jdbc
    jdbc:
      dialect: h2

cms:
  kafka:
    retry:
      max-attempts: 1
      backoff-ms: 500
    consumer:
      concurrency: 1
    idempotency:
      retention-days: 1
      cleanup-cron: "0 0 * * * ?"

logging:
  level:
    com.rbi.cms: DEBUG
    org.kie.kogito: DEBUG
    org.jbpm: DEBUG
