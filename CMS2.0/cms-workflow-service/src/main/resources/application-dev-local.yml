spring:
  datasource:
    url: jdbc:mysql://localhost:3306/CMS_DB?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true&charecterEncoding=UTF-8&useUnicode=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 5000
      pool-name: CMS-Backend-Dev-Pool
      leak-detection-threshold: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 10
        order_inserts: true
        order_updates: true
    open-in-view: false

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      group-id: cms-workflow-group
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      type: single
      missing-topics-fatal: false
      ack-mode: manual

kogito:
  persistence:
    type: jdbc
    jdbc:
      dialect: h2

cms:
  kafka:
    retry:
      max-attempts: 1
      backoff-ms: 500
    consumer:
      concurrency: 1
    idempotency:
      retention-days: 1
      cleanup-cron: "0 0 * * * ?"

logging:
  level:
    com.rbi.cms: DEBUG
    org.kie.kogito: DEBUG
    org.jbpm: DEBUG
