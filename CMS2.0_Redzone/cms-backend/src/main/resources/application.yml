server:
  port: 8082
  error:
    include-message: always
    include-stacktrace: never
  tomcat:
    threads:
      max: 400
      min-spare: 50
    max-connections: 10000
    accept-count: 500
    connection-timeout: 5000
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

spring:
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE_NAME:CMSPDB}}
    username: ${DB_USERNAME:cms_user}
    password: ${DB_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 5000
      pool-name: CMS-HikariPool
      leak-detection-threshold: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true
        generate_statistics: false
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        max.block.ms: ${KAFKA_MAX_BLOCK_MS:5000}
        delivery.timeout.ms: ${KAFKA_DELIVERY_TIMEOUT:10000}
        request.timeout.ms: ${KAFKA_REQUEST_TIMEOUT:5000}
  cache:
    type: hazelcast
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9090/realms/cms}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:9090/realms/cms/protocol/openid-connect/certs}

keycloak:
  admin:
    server-url: ${KEYCLOAK_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:cms}
    client-id: ${KEYCLOAK_ADMIN_CLIENT:admin-cli}
    username: ${KEYCLOAK_ADMIN_USER:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}

cms:
  security:
    # X-User-* identity headers are a dev-local convenience ONLY. Stated explicitly rather than
    # relying on the annotation default, so switching it on is always a visible config change.
    allow-dev-identity-headers: false
  ocr:
    # ── Provider chain (ordered, comma-separated) ──────────────────────────────
    # Providers are tried left-to-right; first non-empty result wins.
    # Supported names: groq | paddle | gemini | openai | huggingface | azure
    # Add your own: implement OcrProvider, annotate @Component, add name here.
    #
    # Examples:
    #   chain: groq, paddle            ← Groq first; PaddleOCR sidecar as fallback
    #   chain: groq, gemini, paddle    ← three-level chain
    #   chain: paddle                  ← PaddleOCR only (no external API needed)
    chain: ${OCR_CHAIN:groq, paddle}

    # ── Groq ──────────────────────────────────────────────────────────────────
    groq-api-key: ${GROQ_API_KEY:}
    groq-model: ${GROQ_MODEL:meta-llama/llama-4-scout-17b-16e-instruct}

    # ── PaddleOCR sidecar (self-hosted, no API key needed) ───────────────────
    # Set to empty string to exclude PaddleOCR from the chain even if listed.
    paddle-ocr-url: ${PADDLE_OCR_URL:http://cms-paddle-ocr:8100}

    # ── Gemini ────────────────────────────────────────────────────────────────
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-2.0-flash}

    # ── OpenAI ────────────────────────────────────────────────────────────────
    openai-api-key: ${OPENAI_API_KEY:}
    openai-model: ${OPENAI_MODEL:gpt-4o-mini}

    # ── HuggingFace ───────────────────────────────────────────────────────────
    huggingface-api-key: ${HUGGINGFACE_API_KEY:}
    huggingface-model: ${HUGGINGFACE_MODEL:microsoft/trocr-large-printed}
    huggingface-inference-url: ${HUGGINGFACE_URL:https://api-inference.huggingface.co/models/}

    # ── Azure Document Intelligence ───────────────────────────────────────────
    azure-endpoint: ${AZURE_DOC_ENDPOINT:}
    azure-api-key: ${AZURE_DOC_API_KEY:}
    azure-model: ${AZURE_DOC_MODEL:prebuilt-read}
  attachments:
    root-path: ${CMS_ATTACHMENTS_PATH:C:/cms-attachments}
    # NFR-006: 2MB per file, 25MB total, 10 files.
    # These are FALLBACKS ONLY. The live limits are SYSTEM_CONFIG rows read by UploadLimitsService
    # (cms.attachments.max_file_size_bytes / max_total_size_bytes), so the limit is changeable at
    # runtime and the frontend reads it from /api/v1/config/upload-limits rather than compiling a copy.
    max-file-size: ${CMS_MAX_FILE_SIZE:2097152}
    max-total-size: ${CMS_MAX_TOTAL_SIZE:26214400}
    chunk-size: ${CMS_CHUNK_SIZE:5242880}
    allowed-types: ${CMS_ALLOWED_TYPES:pdf,png,jpg,jpeg,doc,docx,xls,xlsx,txt,csv,zip}
    max-files-per-complaint: ${CMS_MAX_FILES:10}
    temp-dir: ${CMS_TEMP_DIR:temp-chunks}
  rate-limit:
    complaints-per-minute: ${RATE_LIMIT_CPM:10}
    api-requests-per-second: ${RATE_LIMIT_RPS:100}
  encryption:
    server-secret: ${CMS_ENCRYPTION_SECRET:}
  anti-automation:
    velocity-window-seconds: ${ANTI_AUTO_VELOCITY_WINDOW:60}
    velocity-threshold: ${ANTI_AUTO_VELOCITY_THRESHOLD:30}
    min-form-submission-ms: ${ANTI_AUTO_MIN_FORM_MS:3000}
    require-standard-headers: ${ANTI_AUTO_REQUIRE_HEADERS:true}
  eligibility:
    # Scheme edition whose questions and clause references are served to citizens.
    scheme-version: ${ELIGIBILITY_SCHEME_VERSION:RBIOS_2021}
    # Cited verbatim in the citizen-facing non-maintainable closure letter.
    scheme-name: ${ELIGIBILITY_SCHEME_NAME:Reserve Bank - Integrated Ombudsman Scheme, 2021}
    # UST12: days from the RE complaint date within which the grievance may be brought to the
    # Ombudsman (one year and thirty days minus the 30-day RE window under the 2021 Scheme).
    grievance-filing-window-days: ${ELIGIBILITY_FILING_WINDOW_DAYS:310}
  mre:
    version: ${MRE_VERSION:1}
    re-window-days: ${MRE_RE_WINDOW:30}
    npci-window-days: ${MRE_NPCI_WINDOW:30}
    card-network-window-days: ${MRE_CARD_WINDOW:60}
    filing-deadline-days: ${MRE_FILING_DEADLINE:90}
    limitation-period-years: ${MRE_LIMITATION_YEARS:3}
    window-basis: ${MRE_WINDOW_BASIS:BUSINESS}
  duplicate-check:
    lookback-days: ${DUPLICATE_LOOKBACK_DAYS:90}
    terminal-statuses: ${DUPLICATE_TERMINAL_STATUSES:closed,rejected,withdrawn}
  cors:
    allowed-origins: ${CMS_CORS_ORIGINS:http://localhost:4200,http://localhost:4201,http://localhost:4202,http://localhost:4300}
  similar-cases:
    # Ships DISABLED. This was `true` while the index name below was wrong, so the lookup has been
    # enabled and non-functional in every deployed profile; turning it on is a new-feature decision,
    # not a restoration. Enable per environment once the index is known to be populated.
    enabled: ${SIMILAR_CASES_ENABLED:false}
    elasticsearch-url: ${ELASTICSEARCH_URL:http://localhost:9200}
    # Must match the index cms-search-service actually writes. It read `complaints` while the writer
    # used `cms-complaints`, so every query hit a non-existent index and the empty result was
    # swallowed as "no similar cases found".
    index: ${SIMILAR_CASES_INDEX:cms-complaints}
    connect-timeout-ms: ${SIMILAR_CASES_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${SIMILAR_CASES_READ_TIMEOUT_MS:2000}
  geo:
    enabled: ${GEO_ENABLED:false}
    maxmind-db-path: ${GEO_MAXMIND_DB:}
  tat:
    business-hour-start: ${TAT_HOUR_START:9}
    business-hour-end: ${TAT_HOUR_END:18}
    timezone: ${TAT_TIMEZONE:Asia/Kolkata}
    default-sla-hours: ${TAT_DEFAULT_SLA:240}
  auth:
    otp:
      length: ${OTP_LENGTH:6}
      expiry-minutes: ${OTP_EXPIRY_MINUTES:5}
      max-resend-per-hour: ${OTP_MAX_RESEND_PER_HOUR:5}
      max-verify-attempts-per-otp: ${OTP_MAX_VERIFY_ATTEMPTS:3}
      # UST8: minimum gap between OTP requests for the same mobile, enforced server-side.
      resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:120}
      # Returns the generated OTP in the send-otp RESPONSE BODY. Anyone who can reach the endpoint can
      # then authenticate as any mobile number, so this is an authentication bypass wherever it is on.
      #
      # THE DEFAULT IS false AND MUST STAY false. It previously defaulted to TRUE here and the only
      # override lived in the `prod` profile -- but the OpenShift ConfigMap sets SPRING_PROFILES_ACTIVE
      # to "openshift", a profile that did not exist, so every deployed environment silently took this
      # default and exposed the OTP. A safe default is the control; a profile override was not.
      #
      # dev-local turns it on explicitly (application-dev-local.yml) because the E2E suite reads devOtp
      # to authenticate. OtpExposureGuard refuses to start if it is ever true outside dev-local.
      dev-auto-populate: ${OTP_DEV_AUTO_POPULATE:false}
    captcha:
      length: ${CAPTCHA_LENGTH:6}
      expiry-minutes: ${CAPTCHA_EXPIRY_MINUTES:5}
      image-width: ${CAPTCHA_WIDTH:200}
      image-height: ${CAPTCHA_HEIGHT:60}
    cooloff:
      progression-seconds: ${COOLOFF_PROGRESSION:30,60,120,300,600}
      max-ceiling-seconds: ${COOLOFF_MAX:600}
      reset-after-minutes: ${COOLOFF_RESET_MINUTES:60}
    rate-limit:
      otp-requests-per-mobile-per-hour: ${OTP_RATE_MOBILE_HOUR:5}
      otp-requests-per-ip-per-hour: ${OTP_RATE_IP_HOUR:20}
      login-attempts-per-ip-per-minute: ${LOGIN_RATE_IP_MINUTE:10}
    consent:
      # UST5: bump this whenever the DPDP notice wording changes. Prior consents then stop counting
      # as current, so citizens are re-asked instead of being bound by a notice they never saw.
      version: ${CONSENT_VERSION:DPDP_2023_V1}

crpc:
  threshold:
    max-per-reviewer: ${CRPC_MAX_PER_REVIEWER:30}
    overflow-target: ${CRPC_OVERFLOW_TARGET:CRPC_HEAD}
  scheduling:
    pending-notify-cron: "0 0 9 * * MON-FRI"
    duplicate-check-cron: "0 30 9 * * MON-FRI"
    threshold-check-cron: "0 0 10 * * MON-FRI"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: cms-backend

logging:
  level:
    com.hrms.cms: INFO
    org.hibernate.SQL: WARN

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE_NAME:CMSPDB}}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 100
      minimum-idle: 20
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 3000
      pool-name: CMS-HikariPool-Prod
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
  cache:
    type: hazelcast

server:
  tomcat:
    threads:
      max: 800
      min-spare: 100
    max-connections: 20000
    accept-count: 1000

cms:
  auth:
    otp:
      dev-auto-populate: false

logging:
  level:
    com.hrms.cms: WARN
    org.hibernate.SQL: ERROR

---
# ═══════════════════════════════════════════════════════════════════════════════════════════════
# openshift — THE PROFILE THE CLUSTER ACTUALLY RUNS
#
# cms-infrastructure/openshift/configmaps.yaml sets SPRING_PROFILES_ACTIVE: "openshift", and until now
# NO SUCH PROFILE EXISTED. Spring does not warn about an unknown profile, so every `prod`-only override
# above was dead code in the one environment it was written for, and the deployed service silently ran
# on the base defaults. This block exists so that the profile the cluster names is the profile that
# carries the safety settings.
#
# WHY NOT JUST SWITCH THE DEPLOYMENT TO `prod`? That would work, but it leaves the trap in place: the
# next ConfigMap edit can point at a non-existent profile again and fail silently in exactly the same
# way. Defining `openshift` fixes the environment that exists rather than renaming it.
#
# ⚠️ ddl-auto IS DELIBERATELY NOT SET TO `validate` HERE, unlike `prod`.
# It is coupled to the migrations and they are not yet replayable: a clean-DB replay applies only 15 of
# 60 migrations and creates 55 of 113 tables, because V1/V3 contain Oracle `CREATE SEQUENCE ... NOCACHE`
# that is invalid in MySQL and V5/V6 are not re-runnable. 58 tables exist ONLY because Hibernate created
# them. Setting `validate` today therefore means the service FAILS TO BOOT.
#
# That schema work is a separate, larger task and is escalated, not silently attempted here. The OTP
# exposure is independent of it and is fixed. Inheriting the base `update` is NOT an endorsement --
# Hibernate mutating a production schema at boot remains a real go-live risk that needs the migrations
# repaired first. Do not "tidy" this to `validate` without replaying the migrations on a clean database.
# ═══════════════════════════════════════════════════════════════════════════════════════════════
spring:
  config:
    activate:
      on-profile: openshift
  datasource:
    hikari:
      maximum-pool-size: 100
      minimum-idle: 20
      pool-name: CMS-HikariPool-OpenShift
      leak-detection-threshold: 60000
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 50
  cache:
    type: hazelcast

server:
  tomcat:
    threads:
      max: 800
      min-spare: 100
    max-connections: 20000
    accept-count: 1000

cms:
  auth:
    otp:
      # Belt and braces: the base default is already false, and OtpExposureGuard refuses to start if
      # this is true outside dev-local. Stated explicitly so a reader of this profile can see it.
      dev-auto-populate: false

logging:
  level:
    com.hrms.cms: WARN
    org.hibernate.SQL: ERROR
