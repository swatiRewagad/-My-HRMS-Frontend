server:
  port: 8087
  servlet:
    context-path: /cms-notification

spring:
  application:
    name: cms-notification-service

  # Settles the NOTIFICATION_DELIVERY_LOG rows cms-backend writes as PENDING, so this points at the
  # same schema as cms-backend. ddl-auto is none: cms-backend owns this table's shape.
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE_NAME:CMSPDB}}
    username: ${DB_USERNAME:cms_user}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  mail:
    host: ${SMTP_HOST:smtp.rbi.org.in}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:cms-notifications}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: cms-notification-group
      auto-offset-reset: earliest
      enable-auto-commit: false

cms:
  notification:
    delivery:
      # false → consume and settle rows without contacting SMTP or the SMS gateway. Set this in any
      # environment wired to a real schema but not permitted to mail real complainants.
      enabled: ${NOTIFICATION_DELIVERY_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    com.rbi.cms: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
