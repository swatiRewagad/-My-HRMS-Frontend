<div class="cepc-timeline">
  <div class="timeline-header">
    <h4>{{ 'ui.cepc.panel.audit_trail' | translateOr: 'Audit Trail' }}</h4>
    <button class="refresh-btn" (click)="loadTimeline()" [disabled]="loading()">
      &#x21bb; Refresh
    </button>
  </div>

  @if (loading()) {
    <div class="loading-state">{{ 'ui.cepc.panel.loading_timeline' | translateOr: 'Loading timeline...' }}</div>
  } @else if (error()) {
    <!-- Reported, not swallowed. "This complaint has no recorded actions" and "we could not read the
         audit trail" are very different facts when deciding whether to act. -->
    <div class="error-state" role="alert">
      <span>{{ 'ui.cepc.panel.audit_trail_failed' | translateOr: 'Could not load the audit trail.' }}</span>
      <button class="refresh-btn" (click)="loadTimeline()">{{ 'ui.cepc.dv.action.retry' | translateOr: 'Retry' }}</button>
    </div>
  } @else {
    <app-workflow-timeline
      mode="inline"
      [entries]="entries()"
      emptyText="No timeline entries yet." />
  }
</div>
