<div class="pno-dashboard">

  <!-- ═══ Team workload (UST838) ═══ -->
  <section class="panel">
    <!--
      UST838: the definition of "open records" is not guessable from the number, and a PNO comparing it
      against a raw record count would conclude the dashboard was wrong. So the exclusion is stated
      here, beside the figure it qualifies, rather than hidden in a tooltip.
    -->
    <p class="definition-notice">
      <i class="pi pi-info-circle"></i>
      <span>{{ 're.pno.workload_definition_notice' | translate }}</span>
    </p>

    <!--
      ═══ KPI CARDS ═══
      Both figures come from endpoints that are served: the total from GET /re-portal/reassignment/
      workload (`totalActiveRecords`, the server's own total — never a sum of the rows, see the class
      doc), and the approvals tally from GET /re-portal/reassignment/requests/pending
      (`totalElements`).

      The approvals card is now a LINK to the queue it counts. It was previously an inert tile with a
      text hint naming the screen, because no route existed for it; `re-portal/reassignment/approvals`
      is registered now, so the number takes the PNO to the records.
    -->
    <div class="stats-grid">
      <div class="stat-card total">
        <div class="stat-icon"><i class="pi pi-inbox"></i></div>
        <div class="stat-content">
          <span class="stat-value">{{ totalActiveRecords() }}</span>
          <span class="stat-label">{{ 're.pno.total_active_records' | translate }}</span>
        </div>
      </div>

      <button type="button" class="stat-card pending" (click)="openApprovals()">
        <div class="stat-icon"><i class="pi pi-clock"></i></div>
        <div class="stat-content">
          <span class="stat-value">
            @if (approvalsLoading()) {
              <span class="stat-pending-dash">&mdash;</span>
            } @else {
              {{ pendingApprovalCount() }}
            }
          </span>
          <span class="stat-label">{{ 're.pno.pending_approvals' | translate }}</span>
          <span class="stat-hint">{{ 're.reassign.approvals_title' | translate }}</span>
        </div>
      </button>

      <div class="stat-card moves">
        <div class="stat-icon"><i class="pi pi-sync"></i></div>
        <div class="stat-content">
          <span class="stat-value">{{ totalMoves() }}</span>
          <!--
            Labelled with the history section's own heading, which is what it counts. It was previously
            an EMPTY label, on the grounds that summary_inbound/summary_outbound would both state the
            wrong thing — true, but the heading key states the right thing, and an unlabelled number on
            a dashboard is not readable at all.
          -->
          <span class="stat-label">{{ 're.reassign.history_title' | translate }}</span>
        </div>
      </div>
    </div>

    @if (approvalsError()) {
      <div class="banner banner-error" role="alert">
        <i class="pi pi-exclamation-triangle"></i>
        <span>{{ approvalsError() | translate }}</span>
      </div>
    }

    <!--
      ═══ WORKLOAD, on the shared task grid ═══
      The hand-rolled table this replaces had no sorting, no column filter and no paging, so a PNO at a
      large entity could not find one officer among dozens. The grid supplies all three; the rows are
      still passed in the server's most-loaded-first order and the workload figure is still rendered
      verbatim, because it must equal the reassignment popup's (UST838).

      The grid's own error and empty states carry the translated reason, so the three hand-rolled
      branches below it are gone. A non-PNO landing here reads the server's own `messageKey`.
    -->
    <app-task-grid
      [rows]="sortedOfficers()"
      [columns]="workloadColumns"
      [titleKey]="'re.pno.dashboard_title'"
      rowKey="userId"
      [loading]="workloadLoading()"
      [errorKey]="workloadError() || null"
      [retryable]="true"
      [emptyState]="noOfficers"
      (retry)="loadWorkload()" />

    <ng-template #noOfficers>{{ 're.pno.no_officers' | translate }}</ng-template>
  </section>

  <!-- ═══ Reassignment history summary (UST844) ═══ -->
  <section class="panel">
    <!--
      Also the shared grid. The summary endpoint does carry display names, so these rows name people;
      the formatter falls back to the id when it does not, which is what the old table did inline.

      Its empty state is the grid's generic "no records" — the seeded key set for this screen has no
      "nothing recorded yet" wording, and the total-moves tile above already reads 0.
    -->
    <app-task-grid
      [rows]="historyRows()"
      [columns]="historyColumns"
      [titleKey]="'re.reassign.history_title'"
      rowKey="userId"
      [loading]="historyLoading()"
      [errorKey]="historyError() || null"
      [retryable]="true"
      (retry)="loadHistorySummary()" />
  </section>
</div>
