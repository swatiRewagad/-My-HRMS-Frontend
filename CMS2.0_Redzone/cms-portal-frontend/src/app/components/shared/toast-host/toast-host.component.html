<div class="toast-host" data-testid="toast-host">
  @for (toast of toasts(); track toast.id) {
    <div class="toast"
         [class]="'toast-' + toast.severity"
         [attr.data-severity]="toast.severity"
         role="status"
         [attr.aria-live]="liveness(toast.severity)"
         data-testid="toast">
      <i class="toast-icon" [class]="icon(toast.severity)" aria-hidden="true"></i>
      <span class="toast-message" data-testid="toast-message">{{ toast.messageKey | translate: toast.params }}</span>
      <button type="button"
              class="toast-close"
              data-testid="toast-dismiss"
              [attr.aria-label]="'ui.shell.dismiss_notification' | translate"
              (click)="dismiss(toast.id)">
        <i class="pi pi-times" aria-hidden="true"></i>
      </button>
    </div>
  }
</div>
