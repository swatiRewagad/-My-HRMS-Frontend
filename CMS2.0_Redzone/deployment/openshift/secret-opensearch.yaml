# NOTE: this FILE still has its old OpenSearch name. Renaming it to secret-elasticsearch.yaml is a
# git mv, which this change deliberately does not perform; deploy-all.sh applies it by path, so the
# path and the script agree as they stand.
apiVersion: v1
kind: Secret
metadata:
  name: cms-elasticsearch-secret
  namespace: rbi-cms
  labels:
    app.kubernetes.io/part-of: rbi-cms
type: Opaque
stringData:
  # ELASTICSEARCH_USERNAME, not _USER: SearchProperties exposes cms.search.username, so relaxed
  # binding resolves ELASTICSEARCH_USERNAME. The old key was wrong twice over — wrong product and
  # wrong property — so Elasticsearch credentials were never actually supplied to the client.
  ELASTICSEARCH_USERNAME: "cms_search"
  ELASTICSEARCH_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
